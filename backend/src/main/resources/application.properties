spring.application.name=watch-party-backend
server.port=8080

# --- MySQL ---
# Create the database first: CREATE DATABASE watchparty;
spring.datasource.url=jdbc:mysql://localhost:3306/watchparty?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- JWT ---
# 256-bit secret for HS256. Override via env var in real deployments -
# do not ship this default to production.
jwt.secret=${JWT_SECRET:c3VwZXItc2VjcmV0LWRldi1vbmx5LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMw==}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
